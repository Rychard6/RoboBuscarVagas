# .github/workflows/job-monitor.yml
# GitHub Actions Workflow for Job Monitoring Bot

name: Job Monitor Bot

on:
  push:
    branches:
      - developer

  schedule:
    # Run every 4 hours; 23:30 UTC is 20:30 in Brasília.
    # All configured query groups run each cycle; this is the worst-case alert latency.
    - cron: "30 3,7,11,15,19,23 * * *"

  workflow_dispatch:
    inputs:
      command:
        description: "Search, list the saved opportunity history, or update an opportunity status"
        required: true
        type: choice
        options:
          - search
          - history
          - set-status
        default: search
      job_id:
        description: "Opportunity ID (the 12-character ID shown in Telegram), for set-status"
        required: false
        type: string
      radar:
        description: "Radar whose tracking status should change"
        required: false
        type: choice
        options:
          - radar_a
          - radar_b
        default: radar_a
      status:
        description: "New opportunity tracking status"
        required: false
        type: choice
        options:
          - interessada
          - candidatura_enviada
          - entrevista
          - recusada
          - encerrada
        default: interessada

concurrency:
  group: job-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Dedup IDs and opportunity history live in the Actions cache, not repository commits.
      # Include run_attempt because cache keys are immutable and reruns need a fresh save key.
      - name: Restore opportunity history
        uses: actions/cache/restore@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seen-jobs-

      - name: Ensure history state exists
        run: '[ -f seen_jobs.json ] || echo "{}" > seen_jobs.json'

      - name: Run job search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          MONITOR_COMMAND: ${{ inputs.command }}
          OPPORTUNITY_ID: ${{ inputs.job_id }}
          OPPORTUNITY_RADAR: ${{ inputs.radar }}
          OPPORTUNITY_STATUS: ${{ inputs.status }}
        run: |
          if [ "$MONITOR_COMMAND" = "history" ]; then
            python job_monitor.py --history
          elif [ "$MONITOR_COMMAND" = "set-status" ]; then
            python job_monitor.py --set-status "$OPPORTUNITY_ID" "$OPPORTUNITY_RADAR" "$OPPORTUNITY_STATUS"
          else
            python job_monitor.py
          fi

      - name: Save seen jobs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}-${{ github.run_attempt }}
