# Serper.dev searches public Google results with Brazilian Portuguese queries.
#
# Search is discovery only. Explicit incompatibilities are rejected before scoring;
# missing eligibility details remain pending for confirmation.

settings:
  enabled: true
  max_results_per_query: 10
  min_seconds_between_queries: 2.0
  max_consecutive_failures: 3
  query_negative_terms: []
  serper_language: "pt-br"
  serper_countries: ["br"]
  # 6 requests/run × 6 runs/day ~= 36 Serper credits/day with the current workflow.
  serper_time_filter: "qdr:d"
  serper_max_retries_per_query: 2
  serper_stop_on_rate_limit: true
  job_page_max_fetches: 20

# Three independent search groups per radar keep a broad but manageable search budget.
# Do not add shift/contract/modality exclusions here; each radar validates these separately.
queries:
  radar_a:
    - '("suporte técnico" OR "suporte de TI" OR "suporte de aplicações" OR "help desk" OR "service desk" OR NOC OR "atendimento técnico") (vaga OR emprego)'
    - '("monitoramento de sistemas" OR "monitoramento de infraestrutura" OR "operações de TI" OR "operador de sistemas" OR infraestrutura OR DevOps OR cibersegurança OR "segurança da informação") (vaga OR emprego)'
    - '(Angular OR React OR Next.js OR JavaScript OR TypeScript OR Node.js OR NestJS OR Java OR Python OR COBOL OR Azure OR "Power BI") (desenvolvedor OR infraestrutura OR sistemas) vaga'
  radar_b:
    - '("desenvolvedor front-end" OR "desenvolvedor back-end" OR "full stack" OR "engenharia de software") (Angular OR React OR Next.js OR JavaScript OR TypeScript OR Node.js OR NestJS OR Java OR Python OR COBOL OR "Power BI")'
    - '(suporte OR NOC OR DevOps OR "cloud computing" OR "Microsoft Azure" OR infraestrutura OR "service desk") (júnior OR junior OR pleno OR remoto)'
    - '(estágio OR estagiário OR estagiária OR internship OR intern) (TI OR tecnologia OR desenvolvimento OR informática OR suporte OR infraestrutura) remoto'

# Google search domain restrictions. Results are public search listings; the bot does not
# authenticate to job boards or access their private endpoints.
sites:
  - domain: "greenhouse.io"
    name: "Greenhouse"
  - domain: "ashbyhq.com"
    name: "Ashby"
  - domain: "lever.co"
    name: "Lever"
  - domain: "jobs.workable.com"
    name: "Workable"
  - domain: "wellfound.com"
    name: "Wellfound"
  - domain: "recruitee.com"
    name: "Recruitee"
  - domain: "applytojob.com"
    name: "ApplyToJob"
  - domain: "gupy.io"
    name: "Gupy"
  - domain: "vagas.com.br"
    name: "Vagas.com.br"
  - domain: "infojobs.com.br"
    name: "InfoJobs"
  - domain: "indeed.com.br"
    name: "Indeed Brasil"
  - domain: "programathor.com.br"
    name: "Programathor"
  - domain: "geekhunter.com.br"
    name: "GeekHunter"
  - domain: "linkedin.com/jobs"
    name: "LinkedIn Jobs"
