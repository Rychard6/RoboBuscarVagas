# Serper.dev searches public Google results with Brazilian Portuguese queries.
#
# Search is discovery only. Mandatory contract, location, modality, and seniority
# checks are applied to each result before scoring or notification.

settings:
  enabled: true
  max_results_per_query: 10
  min_seconds_between_queries: 2.0
  max_consecutive_failures: 3
  query_negative_terms: []
  serper_language: "pt-br"
  serper_countries: ["br"]
  # 6 requests/run × 6 runs/day ~= 36 Serper credits/day with the current workflow.
  serper_time_filter: "qdr:d"
  serper_max_retries_per_query: 2
  serper_stop_on_rate_limit: true

# Three independent search groups per radar keep a broad but manageable search budget.
# Do not add shift/contract/modality exclusions here; each radar validates these separately.
queries:
  radar_a:
    - '("suporte técnico" OR "help desk" OR "service desk" OR NOC OR "monitoramento de sistemas" OR "operador de sistemas") (vaga OR emprego)'
    - '("back office" OR "auxiliar administrativo" OR "assistente de operações" OR digitador OR "processamento de dados" OR "cadastro de dados") (vaga OR emprego)'
    - '(Angular OR React OR Next.js OR JavaScript OR TypeScript OR Node.js OR NestJS OR Java OR Python OR COBOL OR Azure OR "Power BI") (desenvolvedor OR infraestrutura OR sistemas) vaga'
  radar_b:
    - '("desenvolvedor front-end" OR "desenvolvedor back-end" OR "full stack" OR "engenharia de software") (Angular OR React OR Next.js OR JavaScript OR TypeScript OR Node.js OR NestJS OR Java OR Python OR COBOL OR "Power BI")'
    - '(suporte OR NOC OR DevOps OR "cloud computing" OR "Microsoft Azure" OR infraestrutura OR "service desk") (júnior OR pleno OR remoto)'
    - '(estágio OR estagiário OR estagiária) (TI OR tecnologia OR desenvolvimento OR informática) remoto'

# Google search domain restrictions. Results are public search listings; the bot does not
# authenticate to job boards or access their private endpoints.
sites:
  - domain: "greenhouse.io"
    name: "Greenhouse"
  - domain: "ashbyhq.com"
    name: "Ashby"
  - domain: "lever.co"
    name: "Lever"
  - domain: "jobs.workable.com"
    name: "Workable"
  - domain: "wellfound.com"
    name: "Wellfound"
  - domain: "recruitee.com"
    name: "Recruitee"
  - domain: "applytojob.com"
    name: "ApplyToJob"
  - domain: "gupy.io"
    name: "Gupy"
  - domain: "vagas.com.br"
    name: "Vagas.com.br"
  - domain: "infojobs.com.br"
    name: "InfoJobs"
  - domain: "indeed.com.br"
