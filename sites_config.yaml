  radars:
    radar_a:
      label: "RADAR A — SEGUNDA RENDA"
      allowed_contracts: ["clt", "pj", "internship"]
      allowed_modalities: ["remote", "hybrid", "onsite"]
      allowed_areas: ["support", "operations", "frontend", "backend", "fullstack", "infrastructure", "security", "it_general"]
      schedule_scores:
        night_confirmed: 95
        mixed: 75
        unknown: 65
        business_hours: 45
      priority_thresholds:
        very_high: 90
        high: 80
        medium: 60
    radar_b:
      label: "RADAR B — CARREIRA EM TECNOLOGIA"
      allowed_contracts: ["pj", "internship"]
      allowed_modalities: ["remote"]
      allowed_seniority: ["internship", "junior", "mid", "senior"]
      allowed_areas: ["support", "operations", "frontend", "backend", "fullstack", "infrastructure", "security", "it_general"]
      internship_areas: ["support", "operations", "frontend", "backend", "fullstack", "infrastructure", "security", "it_general"]
      base_score: 80
      business_hours_bonus: 5
      career_growth_bonus: 5

# Heartbeat / failure alerts so silence means "no new jobs", not "the bot broke".
notifications:
  # Send a Telegram alert when the run has problems (search failures, rate-limit/quota,
  # zero queries executed, or a missing SERPER_API_KEY).
  alert_on_failures: true
  # Send a daily "still alive" status summary even when there are 0 new jobs.
  heartbeat_enabled: true
  # Daily summary/heartbeat runs at 23:55 UTC (20:55 in Brasília).
  heartbeat_hour_utc: 23
  heartbeat_minute_utc: 55

# Global runtime tuning for HTTP behavior and seen-jobs retention.
request:
  timeout: 15
  max_retries: 3
  retry_base_delay: 1.0
  retry_max_delay: 10.0
  concurrent_limit: 10
  per_domain_min_interval: 0.2
  seen_jobs_max: 5000
  seen_jobs_ttl_days: 90
  telegram_max_retries: 3
  telegram_retry_base_delay: 1.0
  telegram_retry_max_delay: 10.0
  # Maximum number of opportunities retained for history/status tracking.
  job_history_max: 5000
